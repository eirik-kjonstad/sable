<svg xmlns="http://www.w3.org/2000/svg" width="104" height="20" role="img" aria-labelledby="title desc">
  <title id="title">Code style: Sable</title>
  <desc id="desc">A badge indicating that code is formatted with Sable.</desc>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".7" />
    <stop offset=".1" stop-color="#ffffff" stop-opacity=".1" />
    <stop offset=".9" stop-color="#000000" stop-opacity=".1" />
    <stop offset="1" stop-color="#000000" stop-opacity=".3" />
  </linearGradient>
  <clipPath id="r">
    <rect width="104" height="20" rx="3" fill="#fff" />
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="62" height="20" fill="#5a4332" />
    <rect x="62" width="42" height="20" fill="#2e2018" />
    <rect width="104" height="20" fill="url(#s)" />
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-size="10">
    <text x="31" y="15" fill="#010101" fill-opacity=".3">code style</text>
    <text x="31" y="14">code style</text>
    <text x="83" y="15" fill="#010101" fill-opacity=".3">sable</text>
    <text x="83" y="14">sable</text>
  </g>
</svg>
